<section class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="d-flex align-items-center mb-3">
                <h3 class="text-primary mb-0">{{ tipo }} Categoria</h3>
            </div>
            <hr class="mb-4">

            <form class="card shadow-sm border-0 rounded-3" 
                  [formGroup]="categoriaForm" 
                  (ngSubmit)="guardar()">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-bold">Nombre</label>
                            <input type="text" 
                                   id="nombre" 
                                   class="form-control form-control-lg"
                                   formControlName="nombre">
                        </div>
                        <div class="col-md-6">
                            <label for="descripcion" class="form-label fw-bold">Descripción</label>
                            <textarea 
                                   id="descripcion" 
                                   class="form-control form-control-lg"
                                   formControlName="descripcion"></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                            <a [routerLink]="['/admon/categorias']" class="btn btn-outline-secondary px-4 py-2">
                                <i class="bi bi-arrow-left me-2"></i>Volver
                            </a>
                            <button type="submit" 
                                    class="btn btn-primary px-4 py-2" 
                                    [disabled]="categoriaForm.invalid">
                                <i class="bi bi-save me-2"></i>{{ tipo === 'Insertar' ? 'Guardar' : 'Actualizar' }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
